<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Content Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 8px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #38bdf8; margin: 0; }
        .upgrade-btn { background: #2563eb; color: white; padding: 8px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .upgrade-btn:hover { background: #1d4ed8; }
        .form-group { display: flex; gap: 10px; margin-top: 20px; }
        input, select { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; }
        button#addBtn { padding: 8px 16px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button#addBtn:hover { background: #16a34a; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #334155; margin-bottom: 8px; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #475569; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .delete-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>Creator Tracker</h1>
            <a href="https://buy.stripe.com/test_00w6oGcc960pcP30sb4AU00" class="upgrade-btn">Upgrade to Pro</a>
        </div>

        <div class="form-group">
            <input type="text" id="taskInput" placeholder="Add new content idea...">
            <select id="statusInput">
                <option value="Planned">Planned</option>
                <option value="In Progress">In Progress</option>
                <option value="Published">Published</option>
            </select>
            <button id="addBtn">Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
